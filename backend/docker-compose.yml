version: '3.8'

services:
  spark-master:
    image: apache/spark:3.5.0
    container_name: ominimo-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    volumes:
      - ./data:/opt/airflow/data
      - ./data:/app/data
      - ./logs:/app/logs
      - ./logs:/opt/airflow/logs
    networks:
      - ominimo-network
    user: root

  spark-worker:
    image: apache/spark:3.5.0
    container_name: ominimo-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - ./data:/opt/airflow/data
      - ./data:/app/data
      - ./logs:/app/logs
      - ./logs:/opt/airflow/logs
    networks:
      - ominimo-network
    user: root

  postgres:
    image: postgres:14
    container_name: ominimo-postgres
    environment:
      - POSTGRES_USER=ominimo
      - POSTGRES_PASSWORD=ominimo123
      - POSTGRES_DB=ominimo_pipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/repo/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ominimo"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - ominimo-network
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ominimo-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@ominimo.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - ominimo-network
    restart: always

  pipeline-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ominimo-api
    ports:
      - "8000:8000"
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://ominimo:ominimo123@postgres:5432/ominimo_pipeline
    volumes:
      - ./src:/app/src
      - ./metadata:/app/metadata
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backend:/app/backend
    depends_on:
      - spark-master
      - postgres
    networks:
      - ominimo-network
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    user: root

  airflow-db:
    image: postgres:14
    container_name: ominimo-airflow-db
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - ominimo-network
    restart: always

  airflow-init:
    image: apache/airflow:2.7.3
    container_name: ominimo-airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      - AIRFLOW__WEBSERVER__SECRET_KEY=ominimo_secret_key_2025
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./metadata:/opt/airflow/metadata
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ./airflow-data:/opt/airflow
    networks:
      - ominimo-network
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@ominimo.com
    restart: on-failure

  airflow-webserver:
    image: my-airflow-image
    container_name: ominimo-airflow-webserver
    command: webserver
    ports:
      - "8793:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      - AIRFLOW__WEBSERVER__SECRET_KEY=ominimo_secret_key_2025
      - AIRFLOW__API__AUTH_BACKEND=airflow.api.auth.backend.basic_auth
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./metadata:/opt/airflow/metadata
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    depends_on:
      - airflow-db
      - airflow-init
      - spark-master
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ominimo-network
    restart: always
    user: root

  airflow-scheduler:
    image: my-airflow-image
    container_name: ominimo-airflow-scheduler
    command: scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./metadata:/opt/airflow/metadata
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    depends_on:
      - airflow-db
      - airflow-init
      - airflow-webserver
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ominimo-network
    restart: always
    user: root

networks:
  ominimo-network:
    driver: bridge

volumes:
  airflow-data:
  airflow-db-data:
  postgres-data:
  pgadmin-data: