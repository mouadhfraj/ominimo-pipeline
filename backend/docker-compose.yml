version: '3.8'

services:
  spark-master:
    image: apache/spark:3.5.0
    container_name: ominimo-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - ominimo-network

  spark-worker:
    image: apache/spark:3.5.0
    container_name: ominimo-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - ominimo-network

  pipeline-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ominimo-api
    ports:
      - "8000:8000"
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
    volumes:
      - ./src:/app/src
      - ./metadata:/app/metadata
      - ./data:/app/data
      - ./logs:/app/logs

    depends_on:
      - spark-master
    networks:
      - ominimo-network
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload

  airflow-webserver:
    image: apache/airflow:2.7.3
    container_name: ominimo-airflow-webserver
    command: webserver
    ports:
      - "8793:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__WEBSERVER__SECRET_KEY=ominimo_secret_key_2025
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./metadata:/opt/airflow/metadata
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ./airflow-data:/opt/airflow
    depends_on:
      - spark-master
    networks:
      - ominimo-network

  airflow-scheduler:
    image: apache/airflow:2.7.3
    container_name: ominimo-airflow-scheduler
    command: scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./metadata:/opt/airflow/metadata
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ./airflow-data:/opt/airflow
    depends_on:
      - airflow-webserver
    networks:
      - ominimo-network

networks:
  ominimo-network:
    driver: bridge

volumes:
  airflow-data: